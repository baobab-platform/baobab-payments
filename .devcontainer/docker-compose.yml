services:
  workspace:
    image: ghcr.io/nabhold/baobab-dev:1.4.1
    command: sleep infinity
    volumes:
      - ..:/workspaces/baobab-payments:cached
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: hyperswitch
      DB_USER: hyperswitch
      DB_PASS: dev-only-password
      DATABASE_URL: postgresql://hyperswitch:dev-only-password@postgres:5432/hyperswitch
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hyperswitch
      POSTGRES_USER: hyperswitch
      POSTGRES_PASSWORD: dev-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperswitch -d hyperswitch"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
