[package]
name = "baobab-payments"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Baobab Payment API (ADR-PAY-0001) with the non-production sandbox provider"
repository = "https://github.com/baobab-platform/baobab-payments"
publish = false

[dependencies]
axum = "0.8.9"
hex = "0.4.3"
jsonschema = { version = "0.57.0", default-features = false, features = ["idna"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[dev-dependencies]
aws-lc-rs = "1.18.1"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
