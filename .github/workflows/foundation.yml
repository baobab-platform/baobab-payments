name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@5930dcf07d16cbb138fa98af0059d9a35e011114
    with:
      foundation_ref: "06c49e878ffc34cd1bc2cc3aac4b5d658f490ea3"
      dependency_review_enabled: false
      # The distroless cc base ships libssl, which this rustls-only binary never
      # links. Debian had no fix for CVE-2026-84782 when it was published, so
      # the container scan ignores findings with no upstream fix; anything with
      # a fixed version still fails. Remove once the base image is patched.
      container_ignore_unfixed: true
