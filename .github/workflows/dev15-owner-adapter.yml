name: DEV-15 native sandbox adapter
on:
  pull_request:
    paths:
      - '.baobab/development_adapter.py'
      - 'tests/dev15/**'
      - '.github/workflows/dev15-owner-adapter.yml'
  push:
    branches: [main]
    paths:
      - '.baobab/development_adapter.py'
      - 'tests/dev15/**'
      - '.github/workflows/dev15-owner-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-health-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6
        with:
          python-version: '3.13'
      - name: Enforce DEV-15 payment-simulation and authority-negative contracts
        run: python3 -B -m unittest discover -s tests/dev15 -p 'test_*.py' -v
      - name: No synthetic owner adapter can self-certify
        run: |
          set -euo pipefail
          if python3 -B .baobab/development_adapter.py exercise > "$RUNNER_TEMP/result.json"; then
            echo "::error::Unqualified financial exercise unexpectedly accepted"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/result.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["result"]=="BLOCKED"
          assert data["simulated_money_only"] is True
          assert data["native_money_effect_observed"] is False
          assert data["eng_onb_runtime_qualified"] is False
          assert data["production_authorized"] is False
          PY
