name: LA-05E5 one-off Cargo lock refresh
on:
  push:
    branches: [feat/la05-payment-durable-execution-composition]
    paths:
      - Cargo.toml
      - .github/workflows/la05-e5-lock-refresh-temporary.yml
permissions:
  contents: read
jobs:
  lock-refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - name: Resolve updated lockfile
        run: |
          cargo update --offline || cargo update
          echo '###CARGO_LOCK_BEGIN###'
          cat Cargo.lock
          echo '###CARGO_LOCK_END###'
