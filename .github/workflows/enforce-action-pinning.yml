# ==============================================================================
# Nabhold Engine Template
# Enforce Action Pinning
#
# File: .github/workflows/enforce-action-pinning.yml
#
# PURPOSE:
#   Delegates to baobab-platform/shared's reusable enforce-action-pinning.yml - fails
#   CI if any `uses:` reference in this repo's .github/workflows or
#   .github/actions isn't pinned to a full 40-character commit SHA.
#   Toolchain-agnostic: needs no application code to run cleanly on an empty
#   scaffold, so it is live (not `.example`) from repository creation.
# ==============================================================================

name: Enforce Action Pinning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    # Accepted Shared v2.3.0 immutable commit; not the older template v1.2.0.
    uses: baobab-platform/shared/.github/workflows/enforce-action-pinning.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
