name: LA-05E2 temporary rustfmt
on:
  push:
    branches: [feat/la05e2-protected-payment-mutation-denial]
    paths: [.github/workflows/la05e2-rustfmt-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'baobab-platform/baobab-payments'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/la05e2-protected-payment-mutation-denial
          persist-credentials: true
      - run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(la05e2): rustfmt protected payment bypass regression"
            git push origin HEAD:feat/la05e2-protected-payment-mutation-denial
          fi
