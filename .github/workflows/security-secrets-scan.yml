# ==============================================================================
# Nabhold Engine Template
# Security - Secret Scanning
#
# File: .github/workflows/security-secrets-scan.yml
#
# PURPOSE:
#   Delegates to nabhold/shared's reusable security-secrets-scan.yml.
#   Toolchain-agnostic (scans committed content for secret patterns, not
#   application code), so it is live (not `.example`) from repository
#   creation - an empty scaffold can and should never accumulate secrets.
#
#   security-codeql.yml.example and security-python.yml.example are kept
#   separate and conditional (see TEMPLATE-USAGE.md step 3): they need a
#   real, CodeQL-supported/uv-managed language to run at all, which this
#   scaffold does not have yet.
# ==============================================================================

name: Security — Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly - catches secrets committed before this check existed, or
    # newly-disclosed detection patterns against unchanged history.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning
    permissions:
      contents: read
    # SHA is nabhold/shared's v1.2.0 tag (annotated - peeled commit, not the
    # tag object's own SHA), verified via `git rev-list -n1 v1.2.0^{}`
    # against a live checkout on 2026-09-05.
    uses: nabhold/shared/.github/workflows/security-secrets-scan.yml@38defb11aacd95a6f68b7db8026fe336417a2af6 # v1.2.0
