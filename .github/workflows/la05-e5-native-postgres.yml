name: LA-05E5 Native Journal to HyperSwitch Integration
on:
  pull_request:
    paths:
      - "src/cp_authority.rs"
      - "src/legal_actor.rs"
      - "src/documentary_restriction.rs"
      - "src/contracts*.rs"
      - "contracts/**"
      - "src/native_execution.rs"
      - "src/hyperswitch.rs"
      - "src/money_movement*.rs"
      - "src/money_movement_execution/**"
      - "db/**"
      - "Cargo.*"
      - ".github/workflows/la05-e5-native-postgres.yml"
  push:
    branches: [main]
    paths:
      - "src/cp_authority.rs"
      - "src/legal_actor.rs"
      - "src/documentary_restriction.rs"
      - "src/contracts*.rs"
      - "contracts/**"
      - "src/native_execution.rs"
      - "src/hyperswitch.rs"
      - "src/money_movement*.rs"
      - "src/money_movement_execution/**"
      - "db/**"
      - "Cargo.*"
      - ".github/workflows/la05-e5-native-postgres.yml"
permissions:
  contents: read
jobs:
  native-durable-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: baobab_payments_test
          POSTGRES_USER: baobab
          POSTGRES_PASSWORD: synthetic_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab -d baobab_payments_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - name: Apply production-shape PostgreSQL 17 journal and RLS fixture
        run: |
          docker run --rm --network host --volume "${GITHUB_WORKSPACE}/db:/db:ro" \
            --env PGPASSWORD=synthetic_only_password postgres:17-alpine sh -euc '
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/migrations/0001_native_payment_journal.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/tests/0001_native_payment_journal.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/migrations/0002_webhook_settlement_reconciliation.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/migrations/0003_money_movement_authority.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/tests/0003_money_movement_authority.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -c "ALTER ROLE payment_ci LOGIN PASSWORD '\''synthetic_runtime_only'\''"
            '
      - name: Exercise Rust journal reservation + local synthetic HTTP provider + replay denial
        env:
          LA05_NATIVE_PG_TEST_URL: "host=127.0.0.1 port=5432 dbname=baobab_payments_test user=payment_ci password=synthetic_runtime_only"
        run: |
          cargo test --locked native_execution::tests::postgres17_commits_intent_before_exactly_one_synthetic_provider_send -- --nocapture
      # P0-04B Payments (ADR-SHARED-035): the money-movement PEP against the real
      # journal as the restricted runtime role, with a loopback CP and provider.
      # LA05_REQUIRE_PG turns a missing database into a failure, never a skip.
      - name: Money-movement PEP on PostgreSQL 17 (Gates A-C)
        env:
          LA05_NATIVE_PG_TEST_URL: "host=127.0.0.1 port=5432 dbname=baobab_payments_test user=payment_ci password=synthetic_runtime_only"
          LA05_NATIVE_PG_ADMIN_URL: "host=127.0.0.1 port=5432 dbname=baobab_payments_test user=baobab password=synthetic_only_password"
          LA05_REQUIRE_PG: "1"
        run: |
          cargo test --locked --lib money_movement -- --nocapture 2>&1 | tee /tmp/money-movement.out
          grep -Eq "test result: ok\. 17 passed" /tmp/money-movement.out
