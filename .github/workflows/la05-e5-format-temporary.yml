name: LA-05E5 one-off rustfmt
on:
  push:
    branches: [feat/la05-payment-durable-execution-composition]
    paths:
      - ".github/workflows/la05-e5-format-temporary.yml"
permissions:
  contents: read
jobs:
  render-rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: rustfmt
      - name: Format files for exact checked-in output
        run: |
          cargo fmt --all
          for f in src/native_execution.rs src/hyperswitch.rs src/documentary_restriction.rs src/service.rs; do
            echo "###FMT_START $f###"
            cat "$f"
            echo "###FMT_END $f###"
          done
