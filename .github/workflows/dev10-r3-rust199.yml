# DEV10-R3 exact stable Rust compatibility with native PG17 acceptance fixture.
# No payment provider's simulation is counted as a real PSP acceptance.
name: DEV10 R3 Rust 1.99.1 Payments native PG17
on:
  # Always exercise the native PostgreSQL 17 gate for PRs; no path-filter bypass.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest-stable-native:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: baobab_payments_test
          POSTGRES_USER: baobab
          POSTGRES_PASSWORD: synthetic_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baobab -d baobab_payments_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - name: Verify exact upstream stable compiler and frozen Cargo lock
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
      - name: Verify the real developer Compose database runs PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker compose -f .devcontainer/docker-compose.yml down --remove-orphans; }
          trap cleanup EXIT
          docker compose -f .devcontainer/docker-compose.yml up -d --wait postgres
          version_num="$(docker compose -f .devcontainer/docker-compose.yml exec -T postgres \
            psql -X -Atq -U hyperswitch -d hyperswitch -c "SHOW server_version_num")"
          if ! [[ "$version_num" =~ ^17[0-9]{4}$ ]]; then
            echo "::error::Payments Dev Container must run PostgreSQL 17; got server_version_num=$version_num"
            exit 1
          fi
          echo "Verified live Payments devcontainer PostgreSQL $version_num"

      - name: Apply actual PostgreSQL 17 journal and denial fixture
        run: |
          set -euo pipefail
          docker run --rm --network host --volume "${GITHUB_WORKSPACE}/db:/db:ro" \
            --env PGPASSWORD=synthetic_only_password postgres:17.11-bookworm sh -euc '
              version_num=$(psql -X -Atq -h 127.0.0.1 -U baobab -d baobab_payments_test -c "SHOW server_version_num")
              test "$version_num" -ge 170000 && test "$version_num" -lt 180000 || {
                echo "Payments journal tests require a real PostgreSQL 17 server (found $version_num)" >&2
                exit 1
              }
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/migrations/0001_native_payment_journal.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/tests/0001_native_payment_journal.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/migrations/0002_webhook_settlement_reconciliation.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/migrations/0003_money_movement_authority.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/tests/0003_money_movement_authority.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -f /db/migrations/0004_native_payment_api.sql
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -c "GRANT SELECT, INSERT ON payment_ops.native_api_request, payment_ops.native_intent, payment_ops.native_intent_cancellation TO payment_ci"
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U baobab -d baobab_payments_test -c "ALTER ROLE payment_ci LOGIN PASSWORD $(printf "\047")synthetic_runtime_only$(printf "\047")"
            '
      - name: Prove native PG17 authority vetoes and nonproduction loopback provider
        env:
          LA05_NATIVE_PG_TEST_URL: "host=127.0.0.1 port=5432 dbname=baobab_payments_test user=payment_ci password=synthetic_runtime_only"
          LA05_NATIVE_PG_ADMIN_URL: "host=127.0.0.1 port=5432 dbname=baobab_payments_test user=baobab password=synthetic_only_password"
          LA05_REQUIRE_PG: "1"
        run: |
          set -euo pipefail
          cargo test --locked native_execution::tests::postgres17_commits_intent_before_exactly_one_synthetic_provider_send -- --nocapture
          cargo test --locked --lib money_movement -- --nocapture 2>&1 | tee "$RUNNER_TEMP/dev10-money-movement.log"
          grep -Eq 'test result: ok\. 21 passed' "$RUNNER_TEMP/dev10-money-movement.log"
      - name: Verify frozen standalone release executable
        run: cargo build --release --locked
