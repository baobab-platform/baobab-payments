name: One-off Rustfmt for feat/la05-webhook-settlement-reconciliation
on:
  push:
    branches: [feat/la05-webhook-settlement-reconciliation]
    paths: [.github/workflows/la05-fmt-once.yml]
permissions:
  contents: read
jobs:
  formatted-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: rustfmt
      - name: Emit exact rustfmt sources
        run: |
          cargo fmt --all
          for f in src/webhook_reconciliation.rs src/settlement_reconciliation.rs src/service.rs src/lib.rs; do
            echo "###FMT_START $f###"
            cat "$f"
            echo "###FMT_END $f###"
          done
