name: Rust CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Test against the pinned Shared contracts
    runs-on: ubuntu-24.04
    # The Foundation Rust gate runs fmt, clippy and tests; this job adds the
    # check that the vendored contracts match the pinned Shared commit.
    env:
      SHARED_CONTRACTS_DIR: ${{ github.workspace }}/.shared-contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned baobab-platform/shared commit
        id: pin
        run: echo "commit=$(grep -m1 'commit:' contracts.lock.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Checkout baobab-platform/shared at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          ref: ${{ steps.pin.outputs.commit }}
          path: .shared-contracts
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - run: cargo test --workspace --all-features --locked
