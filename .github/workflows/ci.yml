name: Rust CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Test against the pinned Shared contracts
    runs-on: ubuntu-24.04
    # The Foundation Rust gate runs fmt, clippy and tests; this job adds the
    # check that the vendored contracts match the pinned Shared commit.
    env:
      SHARED_CONTRACTS_DIR: ${{ github.workspace }}/.shared-contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned baobab-platform/shared commit
        id: pin
        run: echo "commit=$(grep -m1 'commit:' contracts.lock.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Checkout baobab-platform/shared at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          ref: ${{ steps.pin.outputs.commit }}
          path: .shared-contracts
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Verify exact Shared checkout
        env:
          EXPECTED_SHARED_COMMIT: ${{ steps.pin.outputs.commit }}
        run: test "$(git -C .shared-contracts rev-parse HEAD)" = "$EXPECTED_SHARED_COMMIT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: LA05E temporary exact Rust format capture
        run: |
          rustfmt --edition 2024 src/legal_actor.rs
          printf 'LA05E_FMT:'
          base64 -w0 src/legal_actor.rs
          printf '\n'
      - run: cargo test --workspace --all-features --locked
